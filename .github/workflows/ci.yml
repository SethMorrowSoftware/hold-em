# CI for holde-em (Phase 0 gate, IMPLEMENTATION-PLAN.md).
#
# There is no headless way to compile or run a .livecodescript, so CI is the
# static gate plus every pure-logic known-answer test that CAN run headless:
# the evaluator vectors, the betting-engine cases, and the protocol KATs
# (canonical envelopes, hash chain, Level 0 deal). Anything visual, timed, or
# extension-touching stays "verified statically; needs an OXT pass".
name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: static gates (.livecodescript)
        run: python3 tools/check-livecodescript.py
      - name: docs smart-quote scan
        run: python3 tools/check-docs.py
      - name: evaluator KATs (spec 8.2)
        run: python3 tools/evaluator-kat.py
      - name: betting-engine KATs (spec 8.1, 8.3)
        run: python3 tools/betting-kat.py
      - name: shuffle KATs (playable integer deal)
        run: python3 tools/shuffle-kat.py
      - name: protocol KATs (spec 6, 7.1 -- Phase 2 crypto deal)
        run: python3 tools/protocol-kat.py
      - name: transcript-fold KAT (replay-as-audit, hand history)
        run: python3 tools/fold-kat.py
      - name: card-atlas KAT (kit-mode Kenney frame mapping)
        run: python3 tools/atlas-kat.py
      - name: sounds KAT (vendored casino-audio WAVs + stack mapping)
        run: python3 tools/sounds-kat.py
      - name: independent-reference fuzz (rules, not the port)
        run: python3 tools/logic-fuzz.py

  # A THIRD implementation of the protocol crypto path (after the xTalk and the
  # Python KAT), written from HOLDEM-PROTOCOL.md and checked against the same
  # pinned vectors. Its real job is to keep the protocol doc honest: if the doc
  # ever drifts from the implementation, this port -- which follows the doc --
  # stops matching the KAT. Separate job so an npm-registry hiccup cannot red
  # the pure-Python gates above.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install (libsodium-wrappers only)
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: JS protocol conformance (vs tools/protocol-kat.py)
        working-directory: web
        run: node conformance.mjs
      - name: JS engine conformance (differential vs tools/betting-kat.py)
        working-directory: web
        run: node engine-conformance.mjs
      - name: end-to-end table simulation
        working-directory: web
        run: npm run sim
      - name: end-to-end table simulation (lossy transport)
        working-directory: web
        run: npm run sim:lossy
